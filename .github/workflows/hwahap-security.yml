name: Hwahap security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hwahap-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check patch formatting
        run: git diff --check

      - name: Check tracked security boundaries
        run: python3 skills/hwahap/scripts/test_repository_security.py

      - name: Test agent installer
        run: python3 -B -m unittest discover -s skills/hwahap/scripts -p 'test_installer_*.py'

      - name: Test sealed dependencies and documents
        run: python3 skills/hwahap/scripts/test_hwahap_dependency_integrity.py

      - name: Test report safety
        run: python3 skills/hwahap/scripts/test_hwahap_report.py

      - name: Test state and orchestration security
        run: python3 skills/hwahap/scripts/test_hwahap_state.py

      - name: Reject generated repository changes
        run: test -z "$(git status --porcelain --untracked-files=all)"
