name: Functional guidance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Record tools and validate package
        run: |
          python3 --version
          gcc --version
          clang --version
          rustc --version
          python3 general/checks/validate.py
          python3 -m unittest discover -s general/checks -p 'test_*.py' -v
      - name: C debug and optimized release probes
        run: |
          for compiler in gcc clang; do
            for options in '-O0 -g' '-O2 -DNDEBUG'; do
              "$compiler" -std=c11 -Wall -Wextra -Werror -pedantic $options general/checks/native.c -o /tmp/fp-c
              timeout 10s /tmp/fp-c
            done
          done
      - name: C address and undefined behavior probes
        run: |
          clang -std=c11 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer general/checks/native.c -o /tmp/fp-sanitized
          timeout 10s /tmp/fp-sanitized
      - name: Rust debug and release probes
        run: |
          rustfmt --check --edition 2021 general/checks/native.rs
          rustc --edition 2021 -D warnings general/checks/native.rs -o /tmp/fp-rust
          timeout 10s /tmp/fp-rust
          rustc --edition 2021 -D warnings -C opt-level=3 -C overflow-checks=off general/checks/native.rs -o /tmp/fp-rust-release
          timeout 10s /tmp/fp-rust-release
