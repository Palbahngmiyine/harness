when the exact command stays within locked paths and existing authority and
needs no external write, network access, or additional permission. If that is
unclear, return `HW_USER_DECISION_REQUIRED` with bounded evidence and do not
run it. Return a structured pass/fail result; Sol records the official receipt
with source `codex.exec_command`, your thread ID, exact diff digest, command
and output digests, times, and outcome. Do not edit source files, `.hwahap`
state, or configuration, and do not treat missing evidence as a pass.
"""
